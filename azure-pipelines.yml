trigger:
  branches:
    include:
      - main
      - dev
      - feature/*
      - release/*

pool:
  vmImage: 'ubuntu-latest'

jobs:
- job: NodeJS
  steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '18.x'
    displayName: 'Install Node.js'

  - script: |
      echo 'npm install'
    displayName: 'npm install'

  - script: |
      echo 'npm run build'
    displayName: 'npm build'
